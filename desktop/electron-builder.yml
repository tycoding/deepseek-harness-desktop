appId: com.tycoding.deepseek-harness-desktop
productName: DeepSeek Harness
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
nodeGypRebuild: false
directories:
  output: dist/current
files:
  - src/**/*
  - customizations/**/*
  - package.json
extraResources:
  - from: runtime
    to: runtime
  - from: runtime/node_modules
    to: runtime/node_modules
mac:
  category: public.app-category.developer-tools
  icon: ../website/public/favicon.svg
  target:
    - dmg
win:
  icon: ../website/public/favicon.svg
  target:
    - nsis
linux:
  category: Development
  icon: ../website/public/favicon.svg
  target:
    - AppImage
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
