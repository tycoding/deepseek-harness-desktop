<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
  <meta name="color-scheme" content="light dark">
  <title>DeepSeek Harness</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #f7f7f5; color: #181816; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .wrap { display: grid; justify-items: center; gap: 18px; }
    .mark { width: 42px; height: 42px; border: 3px solid #d5d5cf; border-top-color: #181816; border-radius: 50%; animation: spin .8s linear infinite; }
    .name { font-size: 15px; font-weight: 600; letter-spacing: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body { background: #171716; color: #f4f4f0; }
      .mark { border-color: #3a3a37; border-top-color: #f4f4f0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark"></div>
    <div class="name">DeepSeek Harness</div>
  </div>
</body>
</html>
