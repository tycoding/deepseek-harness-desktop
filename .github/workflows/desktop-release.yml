name: Desktop release

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  sync:
    name: Sync official source
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.release.outputs.release_needed }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Synchronize official master
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node desktop/scripts/sync-official.mjs
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi

      - name: Resolve release version
        id: release
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.name }}
    if: needs.sync.outputs.release_needed == 'true'
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            artifact: desktop-macos
            target: --mac dmg
          - name: Windows
            os: windows-2025
            artifact: desktop-windows
            target: --win nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.sync.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install desktop build tools
        run: npm ci --prefix desktop

      - name: Build installer
        working-directory: desktop
        run: |
          npm run prepare:runtime
          npm run smoke
          npx electron-builder --config electron-builder.yml ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            desktop/dist/current/**/*.dmg
            desktop/dist/current/**/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    if: needs.sync.outputs.release_needed == 'true'
    needs: [sync, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.sync.outputs.sha }}
          RELEASE_TAG: ${{ needs.sync.outputs.tag }}
          RELEASE_VERSION: ${{ needs.sync.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "DeepSeek Harness Desktop ${RELEASE_VERSION}" \
              --notes "基于 DeepSeek Harness 官方 ${RELEASE_VERSION} 版本构建。包含 macOS DMG、Windows 安装程序以及 GitHub 自动生成的源码包。"
          fi
          gh release delete-asset "$RELEASE_TAG" OpenConsole.exe --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          find artifacts -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 | \
            xargs -0 gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
